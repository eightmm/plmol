[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plmol"
# Read from plmol/__init__.py rather than repeated here: the two said 0.2.1
# and 0.4.0 at the same time, so `pip show` and `plmol.__version__` disagreed.
dynamic = ["version"]
description = "Unified biomolecular feature extraction for protein, ligand, nucleic acid, and complex modeling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Jaemin Sim" }
]
keywords = [
  "protein",
  "ligand",
  "protein-ligand",
  "nucleic-acid",
  "rna",
  "dna",
  "pdb",
  "mmcif",
  "smiles",
  "feature-extraction",
  "structural-biology",
  "bioinformatics",
  "chemistry",
  "machine-learning",
  "drug-discovery",
  "gnn"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=1.19.0",
  "rdkit>=2020.09.1"
]

[project.optional-dependencies]
# scipy is here because the tests compare the native neighbour search against
# it; the library itself treats it as optional. torch is here for the to_torch
# round-trip tests.
dev = [
  "pytest>=8.0",
  "scipy>=1.8.0",
  "torch>=1.9.0"
]
# plmol returns numpy. torch is needed only to convert those arrays with
# to_torch, and by the protein language models, which are torch models.
torch = [
  "torch>=1.9.0",
]
mmcif = [
    "gemmi>=0.7.5",
]
# scipy's cKDTree is the default backend for k-nearest-neighbour queries, which
# the surface curvature and atom mapping passes use. plmol runs without it on a
# uniform grid instead; the results agree, the grid is slower.
spatial = [
    "scipy>=1.8.0",
]
# Protein language models. Both are optional: plmol imports and runs without
# either, and asking for a model from a missing backend raises DependencyError
# naming the extra to install.
esm = [
    # esm dropped 3.9 before plmol did. The marker keeps the project resolvable
    # on 3.9 without the extra, rather than raising the floor for everyone; on
    # 3.9 the extra installs nothing and load_plm raises DependencyError.
    "esm>=3.0.0; python_version >= '3.10'",
    "torch>=1.9.0",
]
plm = [
    "transformers>=4.40",
    "sentencepiece>=0.2.0",
    "torch>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/eightmm/plmol"
Repository = "https://github.com/eightmm/plmol"
Issues = "https://github.com/eightmm/plmol/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "plmol.__version__" }

[tool.setuptools.packages.find]
include = ["plmol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["plmol"]
omit = [
    "plmol/voxel/features.py",
    "plmol/protein/esm_featurizer.py",
    "plmol/protein/hierarchical_featurizer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise ImportError",
]
