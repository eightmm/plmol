[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plmol"
version = "0.2.1"
description = "Unified biomolecular feature extraction for protein, ligand, nucleic acid, and complex modeling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Jaemin Sim" }
]
keywords = [
  "protein-ligand",
  "ligand",
  "pdb",
  "smiles",
  "feature-extraction",
  "bioinformatics",
  "chemistry",
  "machine-learning",
  "drug-discovery",
  "gnn"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=1.19.0",
  "rdkit>=2020.09.1"
]

[project.optional-dependencies]
# scipy and freesasa are here because the tests compare the native backends
# against them; the library itself treats both as optional. torch is here for
# the to_torch round-trip tests.
dev = [
  "pytest>=8.0",
  "scipy>=1.8.0",
  "freesasa>=2.1.0",
  "torch>=1.9.0"
]
# plmol returns numpy. torch is needed only to convert those arrays with
# to_torch, and by the protein language models, which are torch models.
torch = [
  "torch>=1.9.0",
]
mmcif = [
    "gemmi>=0.7.5",
]
# scipy's cKDTree is the default backend for k-nearest-neighbour queries, which
# the surface curvature and atom mapping passes use. plmol runs without it on a
# uniform grid instead; the results agree, the grid is slower.
spatial = [
    "scipy>=1.8.0",
]
# freesasa is the default SASA backend when installed. plmol computes SASA
# natively without it; the two differ slightly in algorithm and radii.
sasa = [
    "freesasa>=2.1.0",
]
# Protein language models. Both are optional: plmol imports and runs without
# either, and asking for a model from a missing backend raises DependencyError
# naming the extra to install.
esm = [
    "esm>=3.0.0",
    "torch>=1.9.0",
]
plm = [
    "transformers>=4.40",
    "sentencepiece>=0.2.0",
    "torch>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/eightmm/plmol"
Repository = "https://github.com/eightmm/plmol"
Issues = "https://github.com/eightmm/plmol/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["plmol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["plmol"]
omit = [
    "plmol/voxel/features.py",
    "plmol/protein/esm_featurizer.py",
    "plmol/protein/hierarchical_featurizer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise ImportError",
]
